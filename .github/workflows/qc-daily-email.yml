name: QC daily email

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Fetch Gmail credentials from Firebase
        id: gmail
        run: |
          set -euo pipefail
          RAW='{"user":"x","appPassword":"x","fromName":"Bellabona Kitchen","to":"Yousuf@bellabona.com","cc":"Matteo.cricco@bellabona.com, niccolo.lapini@bellabona.com, Abbas@bellabona.com, harsh@bellabona.com, Dhiraj@bellabona.com, Ivan@bellabona.com, Roberto@bellabona.com"}'
          OUT=$(node -e "
          const c = $RAW;
          const fromName = (c.fromName || 'Bellabona Kitchen').trim();
          const fromAddr = (c.fromAddress || c.user || '').trim();
          const sender = fromName ? fromName + ' <' + fromAddr + '>' : fromAddr;
          const to = (c.to || 'Yousuf@bellabona.com').trim();
          const cc = (c.cc || '').trim();
          process.stdout.write([
            'user=' + (c.user || ''),
            'pass=' + (c.appPassword || ''),
            'sender=' + sender,
            'to=' + to,
            'cc=' + cc
          ].join('\n'));
          ")
          echo "$OUT" >> "$GITHUB_OUTPUT"

      - name: Generate PDF and email via Gmail SMTP
        working-directory: scripts
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER: Bellabona Kitchen <${{ secrets.GMAIL_USER }}>
          RECIPIENT: ${{ steps.gmail.outputs.to }}
          CC: ${{ steps.gmail.outputs.cc }}
          PRESET: 'today'
          SUBJECT_PREFIX: 'Quality check report'
        run: node send-snapshot.js
