name: QC daily email
# Sends yesterday's Berlin + Munich QC snapshot every weekday morning.
# 08:00 UTC ≈ 10:00 Berlin in summer (CEST), 09:00 Berlin in winter (CET).
#
# Gmail SMTP credentials are read from Firebase (Berlin project) at
# integrations/gmail/{user,appPassword,fromName,fromAddress}, written by the
# in-app Settings → Email reports (Gmail SMTP) panel.
#
# Use workflow_dispatch (Actions tab → Run workflow) to test a manual send.

on:
  schedule:
    - cron: '0 8 * * 1-5'   # Mon–Fri 08:00 UTC
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Fetch Gmail credentials from Firebase
        id: gmail
        run: |
          set -euo pipefail
          RAW=$(curl -fsSL 'https://quality-control-24-default-rtdb.europe-west1.firebasedatabase.app/integrations/gmail.json')
          if [ -z "$RAW" ] || [ "$RAW" = "null" ]; then
            echo "::error::No Gmail config found in Firebase. Open the app → Settings → Email reports (Gmail SMTP) and fill it in."
            exit 1
          fi
          # Tiny jq-less parser using Node since Node is already on the runner
          OUT=$(node -e "
            const c = $RAW;
            const fromName = (c.fromName || 'Bellabona Kitchen').trim();
            const fromAddr = (c.fromAddress || c.user || '').trim();
            const sender = fromName ? fromName + ' <' + fromAddr + '>' : fromAddr;
            process.stdout.write([
              'user='   + (c.user || ''),
              'pass='   + (c.appPassword || ''),
              'sender=' + sender
            ].join('\n'));
          ")
          echo "$OUT" >> "$GITHUB_OUTPUT"
          # Sanity check
          if [ -z "${OUT##*user=}" ] || [ "${OUT##*user=*pass=}" = "$OUT" ]; then
            echo "Gmail user or password missing."
          fi

      - name: Generate PDF and email via Gmail SMTP
        working-directory: scripts
        env:
          GMAIL_USER: ${{ steps.gmail.outputs.user }}
          GMAIL_APP_PASSWORD: ${{ steps.gmail.outputs.pass }}
          SENDER: ${{ steps.gmail.outputs.sender }}
          RECIPIENT: 'Marcus@bellabona.com'
          CC: 'Matteo.cricco@bellabona.com,niccolo.lapini@bellabona.com,Abbas@bellabona.com,Roberto@bellabona.com,Dhiraj@bellabona.com'
          PRESET: 'yesterday'
          SUBJECT_PREFIX: 'Quality check report'
        run: node send-snapshot.js
