name: QC daily email
# Always sends at 10:00 Europe/Berlin — DST-proof.
# GitHub Actions cron is UTC-only, so we schedule TWICE (08:00 UTC and 09:00 UTC)
# and let the workflow's first step decide which run is the real 10:00 Berlin
# one and short-circuit the other. Summer (CEST) = 08:00 UTC = 10:00 Berlin.
# Winter (CET)  = 09:00 UTC = 10:00 Berlin.
#
# Gmail SMTP credentials are read from Firebase (Berlin project) at
# integrations/gmail/{user,appPassword,fromName,fromAddress} — set via the
# in-app Settings → Email reports (Gmail SMTP) panel.

on:
  # NOTE on the minute mark: GitHub Actions cron is best-effort and the busiest
  # time is the top of the hour (X:00). Scheduling at X:07 reduces the chance
  # of being delayed/skipped. Still "10 AM Berlin" for human purposes.
  schedule:
    - cron: '7 8 * * 1-5'   # 08:07 UTC = 10:07 Berlin in summer (CEST)
    - cron: '7 9 * * 1-5'   # 09:07 UTC = 10:07 Berlin in winter (CET)
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check that it's 10:00 Berlin now
        id: check
        run: |
          HOUR=$(TZ=Europe/Berlin date +%H)
          MIN=$(TZ=Europe/Berlin date +%M)
          echo "Berlin time right now: ${HOUR}:${MIN}"
          if [ "$HOUR" = "10" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
            echo "✓ Proceeding (manual trigger or matches 10:00 Berlin)."
          else
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "⏭  Skipping — the OTHER scheduled run today (DST partner) will fire at 10:00 Berlin."
          fi

      - name: Checkout
        if: steps.check.outputs.proceed == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.check.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check.outputs.proceed == 'true'
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Fetch Gmail credentials from Firebase
        if: steps.check.outputs.proceed == 'true'
        id: gmail
        run: |
          set -euo pipefail
          RAW=$(curl -fsSL 'https://quality-control-24-default-rtdb.europe-west1.firebasedatabase.app/integrations/gmail.json')
          if [ -z "$RAW" ] || [ "$RAW" = "null" ]; then
            echo "::error::No Gmail config found in Firebase. Open the app → Settings → Email reports (Gmail SMTP) and fill it in."
            exit 1
          fi
          OUT=$(node -e "
            const c = $RAW;
            const fromName = (c.fromName || 'Bellabona Kitchen').trim();
            const fromAddr = (c.fromAddress || c.user || '').trim();
            const sender = fromName ? fromName + ' <' + fromAddr + '>' : fromAddr;
            const to = (c.to || 'Marcus@bellabona.com').trim();
            const cc = (c.cc || '').trim();
            process.stdout.write([
              'user='   + (c.user || ''),
              'pass='   + (c.appPassword || ''),
              'sender=' + sender,
              'to='     + to,
              'cc='     + cc
            ].join('\n'));
          ")
          echo "$OUT" >> "$GITHUB_OUTPUT"

      - name: Generate PDF and email via Gmail SMTP
        if: steps.check.outputs.proceed == 'true'
        working-directory: scripts
        env:
          GMAIL_USER: ${{ steps.gmail.outputs.user }}
          GMAIL_APP_PASSWORD: ${{ steps.gmail.outputs.pass }}
          SENDER: ${{ steps.gmail.outputs.sender }}
          RECIPIENT: ${{ steps.gmail.outputs.to }}
          CC: ${{ steps.gmail.outputs.cc }}
          PRESET: 'today'
          SUBJECT_PREFIX: 'Quality check report'
        run: node send-snapshot.js
