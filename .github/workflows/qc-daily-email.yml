name: QC daily email
# Sends yesterday's Berlin + Munich QC snapshot every weekday morning.
# 08:00 UTC ≈ 10:00 Berlin in summer (CEST), 09:00 Berlin in winter (CET).
# Use workflow_dispatch from the Actions tab to test a manual send.

on:
  schedule:
    - cron: '0 8 * * 1-5'   # Mon–Fri 08:00 UTC
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Generate PDF and email via Gmail SMTP
        working-directory: scripts
        env:
          # Gmail SMTP — set these as GitHub repo secrets:
          #   GMAIL_USER          = Harsh@bellabona.com
          #   GMAIL_APP_PASSWORD  = 16-char app password from myaccount.google.com/apppasswords
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # If you ever verify a sending domain in Resend, set this too;
          # the script falls back to Resend automatically when Gmail vars are blank.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDER: 'Bella & Bona QC <Harsh@bellabona.com>'
          RECIPIENT: 'Marcus@bellabona.com'
          CC: 'Matteo.cricco@bellabona.com,niccolo.lapini@bellabona.com,Abbas@bellabona.com,Roberto@bellabona.com,Dhiraj@bellabona.com'
          PRESET: 'yesterday'
          SUBJECT_PREFIX: 'Quality check report'
        run: node send-snapshot.js
