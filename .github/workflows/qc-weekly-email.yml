name: QC weekly email
# Sends the Mon–Fri summary every Friday morning.
# 08:00 UTC ≈ 10:00 Berlin in summer (CEST), 09:00 Berlin in winter (CET).
# (Yes, this runs alongside the daily email on Fridays — by design, so the
# team sees both the previous day's detail and the rolling week summary.)

on:
  schedule:
    - cron: '0 8 * * 5'   # Friday 08:00 UTC
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Generate PDF and email via Gmail SMTP
        working-directory: scripts
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDER: 'Bella & Bona QC <Harsh@bellabona.com>'
          RECIPIENT: 'Marcus@bellabona.com'
          CC: 'Matteo.cricco@bellabona.com,niccolo.lapini@bellabona.com,Abbas@bellabona.com,Roberto@bellabona.com,Dhiraj@bellabona.com'
          PRESET: 'this-week'
          SUBJECT_PREFIX: 'Quality check report — weekly'
        run: node send-snapshot.js
