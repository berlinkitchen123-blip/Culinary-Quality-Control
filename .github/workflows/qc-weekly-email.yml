name: QC weekly email
# Always sends at 10:00 Europe/Berlin every Friday — DST-proof.
# See qc-daily-email.yml for the cron-vs-DST explanation.

on:
  schedule:
    - cron: '0 8 * * 5'   # 08:00 UTC Friday = 10:00 Berlin summer
    - cron: '0 9 * * 5'   # 09:00 UTC Friday = 10:00 Berlin winter
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check that it's 10:00 Berlin now
        id: check
        run: |
          HOUR=$(TZ=Europe/Berlin date +%H)
          echo "Berlin time right now: ${HOUR}h"
          if [ "$HOUR" = "10" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
          else
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "⏭  Skipping — DST partner will fire at 10:00 Berlin."
          fi

      - name: Checkout
        if: steps.check.outputs.proceed == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.check.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check.outputs.proceed == 'true'
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Fetch Gmail credentials from Firebase
        if: steps.check.outputs.proceed == 'true'
        id: gmail
        run: |
          set -euo pipefail
          RAW=$(curl -fsSL 'https://quality-control-24-default-rtdb.europe-west1.firebasedatabase.app/integrations/gmail.json')
          if [ -z "$RAW" ] || [ "$RAW" = "null" ]; then
            echo "::error::No Gmail config found in Firebase. Open the app → Settings → Email reports (Gmail SMTP) and fill it in."
            exit 1
          fi
          OUT=$(node -e "
            const c = $RAW;
            const fromName = (c.fromName || 'Bellabona Kitchen').trim();
            const fromAddr = (c.fromAddress || c.user || '').trim();
            const sender = fromName ? fromName + ' <' + fromAddr + '>' : fromAddr;
            process.stdout.write([
              'user='   + (c.user || ''),
              'pass='   + (c.appPassword || ''),
              'sender=' + sender
            ].join('\n'));
          ")
          echo "$OUT" >> "$GITHUB_OUTPUT"

      - name: Generate PDF and email via Gmail SMTP
        if: steps.check.outputs.proceed == 'true'
        working-directory: scripts
        env:
          GMAIL_USER: ${{ steps.gmail.outputs.user }}
          GMAIL_APP_PASSWORD: ${{ steps.gmail.outputs.pass }}
          SENDER: ${{ steps.gmail.outputs.sender }}
          RECIPIENT: 'Marcus@bellabona.com'
          CC: 'Matteo.cricco@bellabona.com,niccolo.lapini@bellabona.com,Abbas@bellabona.com,Roberto@bellabona.com,Dhiraj@bellabona.com'
          PRESET: 'this-week'
          SUBJECT_PREFIX: 'Quality check report — weekly'
        run: node send-snapshot.js
