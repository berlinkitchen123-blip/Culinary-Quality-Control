<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bella & Bona — Daily QC Snapshot (Berlin + Munich)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f1f5f9;color:#1f2937;line-height:1.4}
body{padding:18px 22px 40px 22px;max-width:1320px;margin:0 auto}
.toolbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.title-block h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-0.02em;color:#0f172a}
.title-block .sub{font-size:12px;color:#64748b;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid #e5e7eb;background:#fff;color:#1f2937;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#f3f4f6}
.btn.primary{background:#2563eb;color:white;border-color:#2563eb}
.btn.primary:hover{background:#1d4ed8}

/* Range picker */
.range-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center;background:#ffffff;border:1px solid #e5e7eb;border-radius:10px;padding:8px}
.range-chip{padding:7px 12px;border-radius:7px;font-size:13px;font-weight:600;border:1px solid transparent;background:transparent;color:#475569;cursor:pointer;line-height:1.2}
.range-chip:hover{background:#f3f4f6;color:#1f2937}
.range-chip.is-on{background:#2563eb;color:white}
.range-chip .sub{display:block;font-size:10px;font-weight:500;color:rgba(255,255,255,0.78);margin-top:1px}
.range-chip:not(.is-on) .sub{color:#94a3b8}
.range-custom{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap}
.range-custom label{font-size:11px;color:#64748b;font-weight:600}
.range-custom input{padding:6px 9px;border:1px solid #e5e7eb;border-radius:6px;font-size:13px;font-family:inherit;color:#1f2937;background:#fff}

.legend{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;margin-bottom:14px}
.legend-cell{padding:10px 12px;border-radius:8px;text-align:center;font-size:11px}
.legend-cell .lbl{font-size:12px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase}
.legend-cell.ok{background:#dcfce7;color:#166534}
.legend-cell.warn{background:#fef3c7;color:#92400e}
.legend-cell.crit{background:#fee2e2;color:#7f1d1d}
.legend-cell .spec{color:#475569;font-weight:500;margin-top:3px}

.cities{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.cities{grid-template-columns:1fr}}
.city{background:#fff;border-radius:14px;border:1px solid #e5e7eb;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,0.04)}
.city-head{display:flex;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid #f3f4f6}
.city-head .mark{width:38px;height:38px;border-radius:9px;color:white;font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.city-head.berlin .mark{background:#2563eb}
.city-head.munich .mark{background:#16a34a}
.city-head .info{flex:1;min-width:0}
.city-head .name{font-size:18px;font-weight:800;color:#0f172a;letter-spacing:-0.01em}
.city-head .meta{font-size:11px;color:#64748b;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.city-head .url{font-size:11px}
.city-head .url a{color:#2563eb;text-decoration:underline}

.scorecard{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;margin-bottom:14px}
.score{padding:12px 8px;border-radius:10px;border:1.5px solid #e5e7eb;text-align:center;background:#f9fafb}
.score.ok{background:#f0fdf4;border-color:#86efac}
.score.warn{background:#fffbeb;border-color:#fcd34d}
.score.crit{background:#fef2f2;border-color:#fca5a5}
.score.na{background:#f9fafb;border-color:#e5e7eb}
.score .pct{font-size:26px;font-weight:800;line-height:1.05;letter-spacing:-0.02em}
.score.ok .pct{color:#16a34a}
.score.warn .pct{color:#ea580c}
.score.crit .pct{color:#b91c1c}
.score.na .pct{color:#9ca3af}
.score .lbl{font-size:11px;font-weight:700;color:#1f2937;margin-top:4px}
.score .frac{font-size:10px;color:#64748b;margin-top:2px}
.score .pill{display:inline-block;margin-top:5px;font-size:9px;font-weight:800;letter-spacing:0.06em;padding:2px 8px;border-radius:99px;color:white}
.score.ok .pill{background:#16a34a}
.score.warn .pill{background:#ea580c}
.score.crit .pill{background:#b91c1c}
.score.na .pill{background:#9ca3af}

.overall{padding:10px 14px;border-radius:10px;background:#0f172a;color:white;display:flex;align-items:center;justify-content:space-between;gap:12px}
.overall .label{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#94a3b8}
.overall .pct-big{font-size:30px;font-weight:800;letter-spacing:-0.02em;line-height:1}
.overall .status-tag{font-size:10px;font-weight:800;letter-spacing:0.06em;padding:3px 8px;border-radius:99px;text-transform:uppercase}
.overall .status-tag.ok{background:#16a34a}
.overall .status-tag.warn{background:#ea580c}
.overall .status-tag.crit{background:#b91c1c}
.overall .status-tag.na{background:#475569}

.dish-list{margin-top:14px}
.dish-list-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#64748b;padding:6px 0;border-bottom:1px solid #e5e7eb;display:grid;grid-template-columns:24px 1fr 60px 60px 60px 60px 60px;gap:6px;align-items:center}
.dish-row{display:grid;grid-template-columns:24px 1fr 60px 60px 60px 60px 60px;gap:6px;padding:5px 0;border-bottom:1px solid #f3f4f6;font-size:12px;align-items:center}
.dish-row .wt-theo{text-align:center;font-variant-numeric:tabular-nums;font-weight:600;color:#475569}
.dish-row .wt-actual{text-align:center;font-variant-numeric:tabular-nums;font-weight:700;border-radius:4px;padding:2px 4px}
.dish-row .wt-actual.dev-ok  {background:#dcfce7;color:#166534}
.dish-row .wt-actual.dev-warn{background:#fef3c7;color:#92400e}
.dish-row .wt-actual.dev-crit{background:#fee2e2;color:#7f1d1d}
.dish-row .wt-actual.dev-na  {color:#9ca3af}
.dish-row:last-child{border-bottom:0}
.dish-row .letter{font-weight:800;color:#0f172a;text-align:center;font-size:11px}
.dish-row .name{font-weight:600;color:#1f2937;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dish-row .stamp{margin-left:6px;font-size:10px;font-weight:500;color:#94a3b8;font-variant-numeric:tabular-nums}
.dish-note{grid-column:1/-1;padding:3px 0 7px 30px;font-size:11px;color:#475569;line-height:1.45;border-bottom:1px solid #f3f4f6}
.dish-note .note-tag{display:inline-block;background:#e0f2fe;color:#0369a1;font-weight:700;font-size:9.5px;letter-spacing:0.04em;text-transform:uppercase;padding:1.5px 6px;border-radius:4px;vertical-align:middle;margin-right:4px}
.dish-note .note-tag.corrective{background:#fef3c7;color:#92400e}
.dish-note .note-txt{color:#1f2937}
.dish-note .note-sep{color:#cbd5e1;margin:0 4px}
body.compact .dish-row .stamp{font-size:11px}
body.compact .dish-note{font-size:12px;padding:4px 0 8px 32px;border-bottom:1px solid #f1f5f9}
body.compact .dish-note .note-tag{font-size:10px;padding:2px 7px}
.dish-row .temp{font-weight:700;text-align:center;border-radius:4px;padding:2px 4px;font-variant-numeric:tabular-nums;font-size:11px}
.temp.ok{background:#dcfce7;color:#166534}
.temp.warn{background:#fef3c7;color:#92400e}
.temp.crit{background:#fee2e2;color:#7f1d1d}
.temp.na{color:#9ca3af}
.dish-list-section{font-size:10px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#475569;padding:8px 0 4px 0;margin-top:6px;border-bottom:1px solid #e5e7eb}
.dish-list-section.hot{color:#b91c1c}
.dish-list-section.cold{color:#1d4ed8}

/* Multi-day daily breakdown table */
.day-breakdown{margin-top:14px}
.day-breakdown-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#64748b;padding:6px 0;border-bottom:1px solid #e5e7eb;display:grid;grid-template-columns:1.5fr 50px 50px 50px 60px;gap:6px;align-items:center}
.day-row{display:grid;grid-template-columns:1.5fr 50px 50px 50px 60px;gap:6px;padding:6px 0;border-bottom:1px solid #f3f4f6;font-size:12px;align-items:center}
.day-row:last-child{border-bottom:0}
.day-row .d-date{font-weight:600;color:#1f2937}
.day-row .d-pct{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;border-radius:4px;padding:2px 4px}
.day-row .d-pct.ok{background:#dcfce7;color:#166534}
.day-row .d-pct.warn{background:#fef3c7;color:#92400e}
.day-row .d-pct.crit{background:#fee2e2;color:#7f1d1d}
.day-row .d-pct.na{color:#9ca3af}

.loading{padding:40px;text-align:center;color:#64748b;font-size:13px}
.err{padding:20px;background:#fef2f2;color:#7f1d1d;border-radius:8px;font-size:13px;border:1px solid #fecaca}

@media print{
    body{background:white;padding:0;max-width:none}
    .toolbar .actions,.range-bar{display:none}
    .city{box-shadow:none;page-break-inside:avoid}
    .cities{grid-template-columns:1fr 1fr}
}

/* === Digital-share layout (activated by ?compact=1) — designed for the
       PDF the cron attaches and that humans open on phones / laptops / in
       chat apps. Generous typography, proper hierarchy, modern cards.
       Multi-page is fine; what matters is each page looking polished. */
body.compact{padding:0;max-width:none;background:#f8fafc;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
/* Hide everything that isn't the city blocks — no cover page, no wasted
   space. Date + brand live INSIDE each city header so each page is fully
   self-contained. */
body.compact .toolbar,
body.compact .range-bar,
body.compact .legend{display:none}
body.compact .cities{grid-template-columns:1fr;gap:0;max-width:1400px;margin:0 auto;padding:0}
body.compact .city{padding:22px 26px;border-radius:0;box-shadow:none;border:0;background:white}
/* Force Munich (and any city beyond the first) onto a fresh page; Berlin
   starts at the very top of page 1 with no cover banner above it. */
body.compact .city + .city{page-break-before:always;break-before:page}
body.compact .city-head{padding-bottom:14px;margin-bottom:16px;gap:14px;border-bottom:1px solid #e2e8f0}
body.compact .city-head .mark{width:48px;height:48px;font-size:20px;border-radius:11px}
body.compact .city-head .name{font-size:24px;font-weight:800;letter-spacing:-0.015em}
body.compact .city-head .meta{font-size:13px;margin-top:3px}
body.compact .city-head .url{display:none}
body.compact .scorecard{grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
body.compact .score{padding:18px 14px;border-radius:12px;border-width:1.5px}
body.compact .score .pct{font-size:38px;line-height:1;letter-spacing:-0.02em}
body.compact .score .lbl{font-size:13px;font-weight:700;margin-top:6px}
body.compact .score .frac{font-size:11px;margin-top:3px}
body.compact .score .pill{font-size:10px;padding:3px 10px;margin-top:8px;letter-spacing:0.06em}
body.compact .overall{padding:14px 18px;margin-bottom:16px;border-radius:11px;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%)}
body.compact .overall .label{font-size:11px;letter-spacing:0.08em;font-weight:700}
body.compact .overall .pct-big{font-size:34px;letter-spacing:-0.02em;font-weight:800}
body.compact .overall .status-tag{font-size:11px;padding:5px 14px;font-weight:800;letter-spacing:0.06em}
body.compact .dish-list{margin-top:6px}
body.compact .dish-list-section{font-size:11px;font-weight:800;letter-spacing:0.08em;padding:10px 0 6px 0;margin-top:6px;border-bottom:1px solid #e2e8f0}
/* Grid: ID · Dish · CP1 · CP2 · CP3 · Theo · Actual */
body.compact .dish-list-head,
body.compact .dish-row{
    display:grid;
    grid-template-columns:30px minmax(220px,1fr) 70px 70px 70px 70px 70px;
    gap:10px;
    align-items:center;
}
body.compact .dish-list-head{font-size:10px;padding:8px 0;color:#64748b;font-weight:700;letter-spacing:0.06em;text-transform:uppercase}
body.compact .dish-row{padding:9px 0;font-size:13px;border-bottom:1px solid #f1f5f9;line-height:1.3}
body.compact .dish-row:last-child{border-bottom:0}
body.compact .dish-row .letter{font-size:12px;font-weight:800}
body.compact .dish-row .name{font-size:13px;font-weight:600}
body.compact .dish-row .temp{font-size:12px;padding:3px 8px;min-width:0;border-radius:5px;font-weight:700}
body.compact .dish-row .wt-theo{font-variant-numeric:tabular-nums;text-align:center;font-size:12px;font-weight:600;color:#475569}
body.compact .dish-row .wt-actual{font-variant-numeric:tabular-nums;text-align:center;font-size:12px;font-weight:700;border-radius:5px;padding:3px 8px}
body.compact .dish-row .wt-actual.dev-ok  {background:#dcfce7;color:#166534}
body.compact .dish-row .wt-actual.dev-warn{background:#fef3c7;color:#92400e}
body.compact .dish-row .wt-actual.dev-crit{background:#fee2e2;color:#7f1d1d}
body.compact .dish-row .wt-actual.dev-na  {color:#9ca3af}
/* Show ALL dishes */
body.compact .dish-row.is-ok{display:grid}
@page{ size:A4 landscape; margin:0 }
@media print{
    body.compact{background:white}
    body.compact .city{page-break-inside:avoid;break-inside:avoid}
}
</style>

<div class="toolbar">

        <h1>Bella & Bona · QC Snapshot</h1>
        <div class="sub" id="sub-line">Loading…</div>
    </div>

        <button class="btn" type="button" onclick="window.location.reload()">↻ Refresh</button>

    <div class="city"><div class="loading">Loading…</div></div>
    <div class="city"><div class="loading">Loading…</div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const CITIES = [
    {
        slug: 'berlin', name: 'Berlin', class: 'berlin',
        config: {
            apiKey: "AIzaSyA3O6Dw0Hj06BH_DUupZvUrufi1jjbDi0g",
            authDomain: "quality-control-24.firebaseapp.com",
            databaseURL: "https://quality-control-24-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "quality-control-24",
            storageBucket: "quality-control-24.firebasestorage.app",
            messagingSenderId: "708146875113",
            appId: "1:708146875113:web:a318755bce78ef99ffbe78"
        }
    },
    {
        slug: 'munich', name: 'Munich', class: 'munich',
        config: {
            apiKey: "AIzaSyDOgS9zY5cAvBHcpzJ5eZeEwi2MsGjhG5c",
            authDomain: "quality-control-86.firebaseapp.com",
            databaseURL: "https://quality-control-86-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "quality-control-86",
            storageBucket: "quality-control-86.firebasestorage.app",
            messagingSenderId: "161960198974",
            appId: "1:161960198974:web:7c08f784d04c47feb2a26f"
        }
    }
];
// Cache one Firebase app per city so we don't re-init when re-rendering
const APPS = {};
function getDb(city){
    if(!APPS[city.slug]) APPS[city.slug] = initializeApp(city.config, city.slug);
    return getDatabase(APPS[city.slug]);
}

// ---- Helpers ----------------------------------------------------------------
const HOT_PASS = 60, HOT_WARN_MIN = 55;
const COLD_PASS = 6, COLD_WARN_MAX = 8;
const WT_OK = 0.05, WT_WARN = 0.10;

const pad2 = (n) => String(n).padStart(2, '0');
const todayIso = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); };
const shiftIso = (iso, days) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + days); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); };
// Mon–Fri only: if today is Sat/Sun, roll back to Friday.
const todayOrLastFriday = () => {
    const d = new Date();
    const dow = d.getDay(); // 0 Sun, 6 Sat
    if(dow === 0) d.setDate(d.getDate() - 2);
    else if(dow === 6) d.setDate(d.getDate() - 1);
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
};
const humanDate = (iso) => {
    const d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
};
const isoYearWeek = (iso) => {
    const d = new Date(iso + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
    const y0 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    const wk = Math.ceil(((d - y0) / 86400000 + 1) / 7);
    return d.getUTCFullYear() + '-' + pad2(wk);
};
// Mon–Fri only: every report skips Sat/Sun (no kitchen ops on weekends)
const datesInRange = (start, end) => {
    const out = [];
    let cur = start, guard = 0;
    while(cur <= end && guard++ < 400){
        const dow = new Date(cur + 'T12:00:00').getDay();
        if(dow !== 0 && dow !== 6) out.push(cur);
        cur = shiftIso(cur, 1);
    }
    return out;
};

// Compute range from preset
function rangeForPreset(preset){
    const today = todayOrLastFriday();
    if(preset === 'today') return { start: today, end: today };
    if(preset === 'yesterday'){
        // "Yesterday" on a Monday = previous Friday (no weekend reports)
        let y = shiftIso(today, -1);
        let dow = new Date(y + 'T12:00:00').getDay();
        while(dow === 0 || dow === 6){ y = shiftIso(y, -1); dow = new Date(y + 'T12:00:00').getDay(); }
        return { start: y, end: y };
    }
    const d = new Date(today + 'T12:00:00');
    const dow = (d.getDay() + 6) % 7; // 0 = Mon
    const monIso = shiftIso(today, -dow);
    if(preset === 'this-week') return { start: monIso, end: shiftIso(monIso, 4) };  // Mon–Fri
    if(preset === 'last-week') return { start: shiftIso(monIso, -7), end: shiftIso(monIso, -3) };  // prev Mon–Fri
    const m1 = today.slice(0,8) + '01';
    const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    const mEnd = today.slice(0,8) + pad2(lastDay);
    if(preset === 'this-month') return { start: m1, end: mEnd };
    if(preset === 'last-month'){
        const pm = new Date(d.getFullYear(), d.getMonth()-1, 1);
        const ld = new Date(d.getFullYear(), d.getMonth(), 0).getDate();
        const s = pm.getFullYear()+'-'+pad2(pm.getMonth()+1)+'-01';
        const e = pm.getFullYear()+'-'+pad2(pm.getMonth()+1)+'-'+pad2(ld);
        return { start: s, end: e };
    }
    return { start: today, end: today };
}

const isCold = (d) => (d?.dishType || '').toLowerCase().includes('cold');
const avg = (arr) => {
    if(!Array.isArray(arr)) return null;
    const nums = arr.filter(x => x != null).map(Number).filter(x => Number.isFinite(x));
    if(!nums.length) return null;
    return nums.reduce((s,v) => s+v, 0) / nums.length;
};
const hotStatus = (v) => v == null ? 'na' : v >= HOT_PASS ? 'ok' : v >= HOT_WARN_MIN ? 'warn' : 'crit';
const coldStatus = (v) => v == null ? 'na' : v <= COLD_PASS ? 'ok' : v <= COLD_WARN_MAX ? 'warn' : 'crit';
const wtStatus = (theo, actual) => {
    if(!theo || actual == null) return 'na';
    const pct = Math.abs((actual - theo) / theo);
    return pct <= WT_OK ? 'ok' : pct <= WT_WARN ? 'warn' : 'crit';
};
const escapeHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---- Fetch + compute --------------------------------------------------------
async function loadCityRange(city, dates){
    const db = getDb(city);
    // Distinct weeks the range spans (one menu fetch per week)
    const weeks = Array.from(new Set(dates.map(isoYearWeek)));
    const [menusEntries, checksEntries] = await Promise.all([
        Promise.all(weeks.map(async wk => [wk, (await get(ref(db, `menus/${wk}`))).val()])),
        Promise.all(dates.map(async dt => [dt, (await get(ref(db, `quality-checks/${dt}`))).val() || {}]))
    ]);
    const menus = Object.fromEntries(menusEntries);
    const checks = Object.fromEntries(checksEntries);
    return { city, menus, checks, dates, weeks };
}

function computeDayScorecard(dishes, checks){
    const c = { hot:{total:0,pass:0}, cold:{total:0,pass:0}, wt:{total:0,pass:0} };
    for(const d of dishes){
        const ck = checks[d.dishLetter] || {};
        const v = avg(ck.temperatures);
        if(v != null){
            if(isCold(d)){
                c.cold.total++;
                const st = coldStatus(v);
                if(st === 'ok' || st === 'warn') c.cold.pass++;
            } else {
                c.hot.total++;
                const st = hotStatus(v);
                if(st === 'ok' || st === 'warn') c.hot.pass++;
            }
        }
        const w = avg(ck.weights);
        if(w != null && d.theoreticalWeight){
            c.wt.total++;
            const st = wtStatus(d.theoreticalWeight, w);
            if(st === 'ok') c.wt.pass++;
        }
    }
    const totalAll = c.hot.total + c.cold.total + c.wt.total;
    const passAll = c.hot.pass + c.cold.pass + c.wt.pass;
    const overallPct = totalAll === 0 ? null : Math.round(passAll / totalAll * 100);
    return { ...c, overall: { total: totalAll, pass: passAll, pct: overallPct } };
}

function computeRangeScorecard(data){
    // Sum the daily scorecards across every day in the range
    const sum = { hot:{total:0,pass:0}, cold:{total:0,pass:0}, wt:{total:0,pass:0} };
    const perDay = [];
    for(const date of data.dates){
        const wk = isoYearWeek(date);
        const menu = data.menus[wk];
        const dishes = (menu && menu.dishes) || [];
        const ck = data.checks[date] || {};
        const sc = computeDayScorecard(dishes, ck);
        sum.hot.total += sc.hot.total;  sum.hot.pass += sc.hot.pass;
        sum.cold.total += sc.cold.total; sum.cold.pass += sc.cold.pass;
        sum.wt.total += sc.wt.total;   sum.wt.pass += sc.wt.pass;
        perDay.push({ date, scorecard: sc, dishCount: dishes.length });
    }
    const totalAll = sum.hot.total + sum.cold.total + sum.wt.total;
    const passAll = sum.hot.pass + sum.cold.pass + sum.wt.pass;
    const overallPct = totalAll === 0 ? null : Math.round(passAll / totalAll * 100);
    return { ...sum, overall: { total: totalAll, pass: passAll, pct: overallPct }, perDay };
}

function overallStatus(pct){
    if(pct == null) return 'na';
    if(pct >= 80) return 'ok';
    if(pct >= 60) return 'warn';
    return 'crit';
}
function cardStatus(rate, total){
    if(total === 0) return 'na';
    if(rate === 100) return 'ok';
    if(rate >= 80) return 'warn';
    return 'crit';
}

function renderCity(data, isSingleDay){
    const sc = computeRangeScorecard(data);
    const hotRate = sc.hot.total === 0 ? 0 : Math.round(sc.hot.pass / sc.hot.total * 100);
    const coldRate = sc.cold.total === 0 ? 0 : Math.round(sc.cold.pass / sc.cold.total * 100);
    const wtRate = sc.wt.total === 0 ? 0 : Math.round(sc.wt.pass / sc.wt.total * 100);
    const ovStatus = overallStatus(sc.overall.pct);

    const baseUrl = window.location.origin + window.location.pathname.replace(/[^/]+$/, '');
    const cityAppUrl = `${baseUrl}redesign-prototype.html?city=${data.city.slug}`;

    // For single-day views: keep the live dish list. For multi-day: switch
    // to a per-day breakdown table (date · hot% · cold% · wt% · overall%).
    let bodyHtml;
    if(isSingleDay){
        const date = data.dates[0];
        const wk = isoYearWeek(date);
        const menu = data.menus[wk];
        const dishes = (menu && menu.dishes) || [];
        const checks = data.checks[date] || {};
        const hotDishes = dishes.filter(d => !isCold(d)).sort((a,b) => (a.dishLetter || '').localeCompare(b.dishLetter || '', 'en', { numeric: true }));
        const coldDishes = dishes.filter(d => isCold(d)).sort((a,b) => (a.dishLetter || '').localeCompare(b.dishLetter || '', 'en', { numeric: true }));
        const dishRow = (d, isHot) => {
            const c = checks[d.dishLetter] || {};
            const a = c.assembly && (c.assembly.temps ? avg(c.assembly.temps) : c.assembly.temp);
            const q = avg(c.temperatures);
            const dp = c.dispatch && (c.dispatch.temps ? avg(c.dispatch.temps) : c.dispatch.temp);
            const wActual = avg(c.weights);
            const wTheo = d.theoreticalWeight;
            const stOf = (v) => v == null ? 'na' : (isHot ? hotStatus(v) : coldStatus(v));
            const worst = ['crit','warn','ok','na'].find(s => [a,q,dp].some(v => stOf(v) === s)) || 'na';
            const tCell = (v) => {
                if(v == null) return `<span class="temp na">—</span>`;
                return `<span class="temp ${stOf(v)}">${v.toFixed(1)}°</span>`;
            };
            // Weight deviation — gram-based thresholds (head-chef rule):
            //   diff ≤ 30 g → OK   (green)
            //   diff ≤ 50 g → WARN (light orange)
            //   diff > 50 g → CRIT (light red)
            let wtSt = 'na';
            if(wTheo && wActual != null){
                const diff = Math.abs(wActual - wTheo);
                wtSt = diff <= 30 ? 'ok' : diff <= 50 ? 'warn' : 'crit';
            }
            const wtTheoTxt = wTheo ? Math.round(wTheo)+'g' : '—';
            const wtActualTxt = wActual != null ? Math.round(wActual)+'g' : '—';
            // Most recent HH:MM stamp across the three checkpoints (CP3 wins if present)
            const stamp = (c.dispatch && c.dispatch.time) || c.qcTime || (c.assembly && c.assembly.time) || null;
            const stampHtml = stamp ? `<span class="stamp">@ ${escapeHtml(stamp)}</span>` : '';
            const comment = (c.comment || '').trim();
            const corrective = (c.correctiveAction || '').trim();
            const noteHtml = (comment || corrective) ? `
                <div class="dish-note">
                    ${comment ? `<span class="note-tag">Note</span> <span class="note-txt">${escapeHtml(comment)}</span>` : ''}
                    ${(comment && corrective) ? '<span class="note-sep"> · </span>' : ''}
                    ${corrective ? `<span class="note-tag corrective">Action</span> <span class="note-txt">${escapeHtml(corrective)}</span>` : ''}
                </div>` : '';
            return `<div class="dish-row is-${worst}">
                <span class="letter">${escapeHtml(d.dishLetter)}</span>
                <span class="name">${escapeHtml(d.dishName)} ${stampHtml}</span>
                ${tCell(a)}
                ${tCell(q)}
                ${tCell(dp)}
                <span class="wt-theo">${wtTheoTxt}</span>
                <span class="wt-actual dev-${wtSt}">${wtActualTxt}</span>
            </div>${noteHtml}`;
        };
        bodyHtml = `
            <div class="dish-list">
                <div class="dish-list-head">
                    <span></span><span>Dish</span>
                    <span style="text-align:center">CP1</span>
                    <span style="text-align:center">CP2</span>
                    <span style="text-align:center">CP3</span>
                    <span style="text-align:center">Theo</span>
                    <span style="text-align:center">Actual</span>
                </div>
                ${hotDishes.length ? `<div class="dish-list-section hot">Hot dishes (${hotDishes.length})</div>` : ''}
                ${hotDishes.map(d => dishRow(d, true)).join('')}
                ${coldDishes.length ? `<div class="dish-list-section cold">Cold dishes (${coldDishes.length})</div>` : ''}
                ${coldDishes.map(d => dishRow(d, false)).join('')}
            </div>
        `;
    } else {
        const cellPct = (rate, total) => {
            if(total === 0) return `<span class="d-pct na">—</span>`;
            const st = cardStatus(rate, total);
            return `<span class="d-pct ${st}">${rate}%</span>`;
        };
        bodyHtml = `
            <div class="day-breakdown">
                <div class="day-breakdown-head">
                    <span>Date</span>
                    <span style="text-align:center">Hot</span>
                    <span style="text-align:center">Cold</span>
                    <span style="text-align:center">Wt</span>
                    <span style="text-align:center">Overall</span>
                </div>
                ${sc.perDay.map(p => {
                    const s = p.scorecard;
                    const hr = s.hot.total === 0 ? 0 : Math.round(s.hot.pass/s.hot.total*100);
                    const cr = s.cold.total === 0 ? 0 : Math.round(s.cold.pass/s.cold.total*100);
                    const wr = s.wt.total === 0 ? 0 : Math.round(s.wt.pass/s.wt.total*100);
                    const ovPct = s.overall.pct;
                    const ovSt = overallStatus(ovPct);
                    return `<div class="day-row">
                        <span class="d-date">${humanDate(p.date)}</span>
                        ${cellPct(hr, s.hot.total)}
                        ${cellPct(cr, s.cold.total)}
                        ${cellPct(wr, s.wt.total)}
                        <span class="d-pct ${ovSt}">${ovPct == null ? '—' : ovPct + '%'}</span>
                    </div>`;
                }).join('')}
            </div>
        `;
    }

    // City meta (count of dishes — for single day take that day, for range
    // count distinct dishLetters across all weeks)
    let dishCount = 0;
    if(isSingleDay){
        const wk = isoYearWeek(data.dates[0]);
        dishCount = ((data.menus[wk] && data.menus[wk].dishes) || []).length;
    } else {
        const distinct = new Set();
        for(const wk of data.weeks){
            const m = data.menus[wk];
            if(m && m.dishes) for(const d of m.dishes) distinct.add(d.dishLetter);
        }
        dishCount = distinct.size;
    }

    return `
        <div class="city">
            <div class="city-head ${data.city.class}">
                <div class="mark">${data.city.name.charAt(0)}</div>
                <div class="info">
                    <div class="name">${data.city.name} · Bella &amp; Bona QC</div>
                    <div class="meta">${humanDate(data.dates[0])}${data.dates.length>1?' → '+humanDate(data.dates[data.dates.length-1]):''} · ${dishCount} dish${dishCount===1?'':'es'}${data.dates.length>1?' · '+data.dates.length+' days':''}</div>
                </div>
                <div class="url"><a href="${cityAppUrl}" target="_blank">Open app →</a></div>
            </div>

            <div class="scorecard">
                <div class="score ${cardStatus(hotRate, sc.hot.total)}">
                    <div class="pct">${sc.hot.total === 0 ? '—' : hotRate + '%'}</div>
                    <div class="lbl">Hot dishes</div>
                    <div class="frac">${sc.hot.pass}/${sc.hot.total} pass</div>
                    <div class="pill">${cardStatus(hotRate, sc.hot.total).toUpperCase()}</div>
                </div>
                <div class="score ${cardStatus(coldRate, sc.cold.total)}">
                    <div class="pct">${sc.cold.total === 0 ? '—' : coldRate + '%'}</div>
                    <div class="lbl">Cold dishes</div>
                    <div class="frac">${sc.cold.pass}/${sc.cold.total} pass</div>
                    <div class="pill">${cardStatus(coldRate, sc.cold.total).toUpperCase()}</div>
                </div>
                <div class="score ${cardStatus(wtRate, sc.wt.total)}">
                    <div class="pct">${sc.wt.total === 0 ? '—' : wtRate + '%'}</div>
                    <div class="lbl">Weight</div>
                    <div class="frac">${sc.wt.pass}/${sc.wt.total} within 5%</div>
                    <div class="pill">${cardStatus(wtRate, sc.wt.total).toUpperCase()}</div>
                </div>
            </div>

            <div class="overall">
                <div>
                    <div class="label">Overall compliance${isSingleDay ? '' : ' (range)'}</div>
                    <div class="pct-big">${sc.overall.pct == null ? '—' : sc.overall.pct + '%'}</div>
                </div>
                <span class="status-tag ${ovStatus}">${ovStatus === 'na' ? 'No data' : ovStatus.toUpperCase()}</span>
            </div>

            ${bodyHtml}
        </div>
    `;
}

// ---- Range state + range UI ------------------------------------------------
const params = new URLSearchParams(window.location.search);
const rangeState = {
    preset: params.get('preset') || (params.get('date') ? 'custom' : 'today'),
    start: params.get('date') || params.get('start') || todayOrLastFriday(),
    end: params.get('end') || params.get('date') || todayOrLastFriday()
};
// Compact mode: strips everything non-essential so the page fits one A4 sheet.
// Used by the scheduled email cron (Puppeteer renders this URL with &compact=1).
const COMPACT = params.get('compact') === '1';
if(COMPACT) document.body.classList.add('compact');

function renderRangeBar(){
    const bar = document.getElementById('range-bar');
    const presets = [
        { id:'today', label:'Today', sub: humanDate(todayIso()) },
        { id:'yesterday', label:'Yesterday', sub: humanDate(shiftIso(todayIso(), -1)) },
        { id:'this-week', label:'This week', sub:'Mon–Fri' },
        { id:'last-week', label:'Last week', sub:'previous Mon–Fri' },
        { id:'this-month', label:'This month', sub:'1st–end' },
        { id:'last-month', label:'Last month', sub:'previous month' },
        { id:'custom', label:'Custom', sub:'pick from / to' }
    ];
    bar.innerHTML = presets.map(p =>
        `<button class="range-chip ${rangeState.preset===p.id?'is-on':''}" type="button" data-preset="${p.id}">${p.label}<span class="sub">${p.sub}</span></button>`
    ).join('') + `
        <div class="range-custom" id="range-custom-host" ${rangeState.preset==='custom'?'':'style="display:none"'}>
            <label>From <input type="date" id="rng-from" value="${rangeState.start}"/></label>
            <label>To <input type="date" id="rng-to" value="${rangeState.end}"/></label>
        </div>
    `;
    bar.querySelectorAll('[data-preset]').forEach(btn => {
        btn.addEventListener('click', () => {
            rangeState.preset = btn.getAttribute('data-preset');
            if(rangeState.preset !== 'custom'){
                const r = rangeForPreset(rangeState.preset);
                rangeState.start = r.start; rangeState.end = r.end;
            }
            renderRangeBar();
            loadAndRender();
        });
    });
    const f = document.getElementById('rng-from');
    const t = document.getElementById('rng-to');
    if(f) f.addEventListener('change', () => { rangeState.start = f.value; rangeState.end = rangeState.end < f.value ? f.value : rangeState.end; renderRangeBar(); loadAndRender(); });
    if(t) t.addEventListener('change', () => { rangeState.end = t.value; renderRangeBar(); loadAndRender(); });
}

// ---- Load + render ---------------------------------------------------------
async function loadAndRender(){
    const r = rangeState.preset === 'custom' ? { start: rangeState.start, end: rangeState.end } : rangeForPreset(rangeState.preset);
    if(!r.start || !r.end || r.start > r.end){
        document.getElementById('cities').innerHTML = `<div class="err">Bad date range — adjust the dates above.</div>`;
        return;
    }
    const dates = datesInRange(r.start, r.end);
    const isSingleDay = dates.length === 1;
    const rangeTxt = isSingleDay ? humanDate(r.start) : `${humanDate(r.start)} → ${humanDate(r.end)}  ·  ${dates.length} days`;
    document.getElementById('sub-line').textContent = `${rangeTxt}  ·  Berlin + Munich  ·  Refreshed ${new Date().toLocaleTimeString('en-GB')}`;

    const host = document.getElementById('cities');
    host.innerHTML = `<div class="city"><div class="loading">Loading Berlin…</div></div><div class="city"><div class="loading">Loading Munich…</div></div>`;
    window.__cityData = {};
    try {
        const results = await Promise.all(CITIES.map(c => loadCityRange(c, dates)
            .then(d => { window.__cityData[c.slug] = d; return d; })
            .catch(err => ({ city: c, dates, weeks:[], menus:{}, checks:{}, error: err.message || String(err) }))
        ));
        host.innerHTML = results.map(r => {
            if(r.error){
                return `<div class="city"><div class="city-head ${r.city.class}"><div class="mark">${r.city.name.charAt(0)}</div><div class="info"><div class="name">${r.city.name}</div><div class="meta">Failed to load</div></div></div><div class="err">${escapeHtml(r.error)}</div></div>`;
            }
            return renderCity(r, isSingleDay);
        }).join('');
    } catch(err){
        host.innerHTML = `<div class="err">Failed to load: ${escapeHtml(err.message || String(err))}</div>`;
    }
}

window.copySummary = function(){
    const data = window.__cityData || {};
    const r = rangeState.preset === 'custom' ? { start: rangeState.start, end: rangeState.end } : rangeForPreset(rangeState.preset);
    const dates = datesInRange(r.start, r.end);
    const isSingleDay = dates.length === 1;
    const out = [];
    out.push(`Bella & Bona — QC Snapshot`);
    out.push(isSingleDay ? humanDate(r.start) : `${humanDate(r.start)} → ${humanDate(r.end)} (${dates.length} days)`);
    out.push(``);
    for(const slug of ['berlin', 'munich']){
        const d = data[slug];
        if(!d){ out.push(`${slug.toUpperCase()}: failed to load`); continue; }
        const sc = computeRangeScorecard(d);
        const hotRate = sc.hot.total === 0 ? '—' : Math.round(sc.hot.pass/sc.hot.total*100) + '%';
        const coldRate = sc.cold.total === 0 ? '—' : Math.round(sc.cold.pass/sc.cold.total*100) + '%';
        const wtRate = sc.wt.total === 0 ? '—' : Math.round(sc.wt.pass/sc.wt.total*100) + '%';
        const ov = sc.overall.pct == null ? '—' : sc.overall.pct + '%';
        const status = overallStatus(sc.overall.pct).toUpperCase();
        out.push(`*${d.city.name.toUpperCase()}* — overall ${ov} (${status})`);
        out.push(`  Hot:    ${hotRate}  (${sc.hot.pass}/${sc.hot.total} pass)`);
        out.push(`  Cold:   ${coldRate}  (${sc.cold.pass}/${sc.cold.total} pass)`);
        out.push(`  Weight: ${wtRate}  (${sc.wt.pass}/${sc.wt.total} within 5%)`);
        out.push(``);
    }
    out.push(`— Sent from Bella & Bona QC Snapshot`);
    const text = out.join('\n');
    navigator.clipboard.writeText(text).then(() => {
        alert('Summary copied — paste it into your email.');
    }).catch(() => {
        prompt('Copy this:', text);
    });
};

// ---- Boot ------------------------------------------------------------------
renderRangeBar();
// If launched with a preset that's not custom, recompute start/end so the URL
// `?preset=this-week` shows the right window.
if(rangeState.preset !== 'custom'){
    const r = rangeForPreset(rangeState.preset);
    rangeState.start = r.start; rangeState.end = r.end;
}
loadAndRender();
</script>

</body>
</html>
