<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Culinary Quality Control</title>
    <style>
        html.dark body {
            background-color: #0f172a;
            color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
        }

        .overflow-x-auto {
            -webkit-overflow-scrolling: touch;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        button,
        .nav-btn {
            user-select: none;
            touch-action: manipulation;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        #daily-summary-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 1024px) {
            #daily-summary-container {
                grid-template-columns: 1fr 1fr;
            }

            .full-width-section {
                grid-column: span 2;
            }
        }
    </style>
    <script>
        // Polyfill for dependencies expecting Node.js environment variables
        window.process = { env: { NODE_ENV: 'production' } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    screens: {
                        'xs': '375px',
                    }
                }
            }
        }
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="antialiased font-sans selection:bg-indigo-500/30">
    <div id="app-container" class="min-h-screen flex flex-col">
        <header class="bg-slate-900/90 backdrop-blur-xl shadow-2xl sticky top-0 z-50 border-b border-slate-800">
            <div class="max-w-7xl mx-auto px-4">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center space-x-2 sm:space-x-4">
                        <div
                            class="bg-gradient-to-br from-indigo-500 to-indigo-700 p-2 rounded-xl shadow-lg shadow-indigo-500/20">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                                    d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                        <nav class="flex bg-slate-800/80 p-1 rounded-xl border border-slate-700">
                            <button id="nav-production-btn"
                                class="px-3 sm:px-5 py-2 text-[10px] font-black rounded-lg transition-all uppercase text-slate-400 hover:text-white">Production</button>
                            <button id="nav-prep-btn"
                                class="px-3 sm:px-5 py-2 text-[10px] font-black rounded-lg transition-all uppercase text-slate-400 hover:text-white">Kitchen
                                Log</button>
                            <button id="nav-dashboard-btn"
                                class="px-3 sm:px-5 py-2 text-[10px] font-black rounded-lg transition-all uppercase">Live
                                Check</button>
                            <button id="nav-audit-btn"
                                class="px-3 sm:px-5 py-2 text-[10px] font-black rounded-lg transition-all uppercase text-slate-400 hover:text-white">Analytics</button>
                        </nav>
                    </div>
                    <div class="flex items-center space-x-3">
                        <button id="settings-btn"
                            class="p-2.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition-all active:scale-95 border border-transparent hover:border-slate-700">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4">
                                </path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-grow p-4 sm:p-8 max-w-7xl mx-auto w-full overflow-x-hidden">
            <div id="date-selector-container"
                class="sticky top-0 z-40 mb-6 flex items-center justify-between bg-slate-800/80 p-3 rounded-3xl border border-slate-700/50 shadow-2xl backdrop-blur-md transition-all">
                <button id="prev-week-btn"
                    class="p-4 rounded-2xl hover:bg-slate-700/50 text-slate-400 transition-all active:scale-90">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7">
                        </path>
                    </svg>
                </button>
                <div id="date-buttons-container" class="flex items-center space-x-3 overflow-x-auto scrollbar-hide">
                </div>
                <button id="next-week-btn"
                    class="p-4 rounded-2xl hover:bg-slate-700/50 text-slate-400 transition-all active:scale-90">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>

            <div id="loading-indicator" class="flex flex-col items-center justify-center py-32 hidden">
                <div class="relative w-16 h-16">
                    <div class="absolute inset-0 border-4 border-indigo-500/10 rounded-full"></div>
                    <div
                        class="absolute inset-0 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin">
                    </div>
                </div>
                <p class="mt-6 text-[10px] text-slate-500 font-black uppercase tracking-[0.4em] animate-pulse">Loading
                    System Data</p>
            </div>

            <!-- Production Screen View -->
            <section id="production-view" class="hidden space-y-8 animate-in fade-in slide-in-from-left-6 duration-500">
                <div id="production-header"
                    class="flex flex-col sm:flex-row items-start sm:items-center justify-between px-2 gap-4">
                    <div>
                        <h2 class="text-3xl font-black text-white italic tracking-tighter uppercase">Production Line
                        </h2>
                        <p class="text-[10px] font-black text-orange-400 uppercase tracking-[0.4em] mt-2">Order
                            Aggregation System</p>
                    </div>
                    <div id="production-stats" class="flex gap-4">
                        <!-- Stats injected via JS -->
                    </div>
                </div>
                <div id="production-content-container" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <!-- Columns injected via JS -->
                </div>
            </section>

            <!-- Kitchen Log View -->
            <section id="prep-view" class="hidden space-y-8 animate-in fade-in slide-in-from-left-6 duration-500">
                <div class="flex items-center justify-between px-2">
                    <div>
                        <h2 class="text-3xl font-black text-white italic tracking-tighter uppercase">Kitchen Log</h2>
                        <p class="text-[10px] font-black text-emerald-400 uppercase tracking-[0.4em] mt-2">Process &
                            Thermal Validation</p>
                    </div>
                </div>
                <div id="prep-grid-container"
                    class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6"></div>
            </section>

            <!-- Dashboard View -->
            <div id="main-view" class="space-y-8">


                <section id="dish-selection-view">
                    <div class="flex items-center justify-between mb-4 px-2">
                        <h2 class="text-[11px] font-black text-slate-400 uppercase tracking-[0.3em]">Operational Units
                        </h2>
                    </div>
                    <div id="dish-grid-container"
                        class="grid grid-cols-2 xs:grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-4">
                    </div>
                </section>

                <section id="daily-summary-section" class="hidden">
                    <div class="flex items-center justify-between mb-5 px-2">
                        <div class="flex items-center gap-4">
                            <h2 class="text-[11px] font-black text-slate-400 uppercase tracking-[0.3em]">Split
                                Intelligence Recap</h2>
                        </div>
                    </div>
                    <div id="daily-summary-container"></div>
                </section>

                <div id="welcome-placeholder" class="hidden"></div>
            </div>

            <!-- Analytics View -->
            <section id="ai-agent-view"
                class="hidden max-w-6xl mx-auto space-y-8 animate-in fade-in slide-in-from-bottom-6 duration-700">
                <div
                    class="bg-gradient-to-r from-indigo-600 to-indigo-800 rounded-[3rem] p-10 text-white shadow-2xl relative overflow-hidden group">
                    <div class="relative z-10">
                        <h2 class="text-3xl font-black tracking-tighter italic">Analytical Audit Core</h2>
                        <p class="text-indigo-100 text-[10px] font-black uppercase tracking-[0.5em] mt-2 opacity-80">
                            Historical Performance Matrix</p>
                    </div>
                </div>
                <div id="audit-results-container" class="space-y-10 pb-20"></div>
            </section>

            <!-- Detail View -->
            <section id="dish-detail-view" class="hidden animate-in fade-in slide-in-from-right-12 duration-500">
                <button id="back-to-menu-btn"
                    class="flex items-center gap-3 px-6 py-4 mb-8 text-[11px] font-black rounded-[1.5rem] bg-slate-800 text-slate-300 border border-slate-700 hover:text-white transition-all active:scale-95 shadow-2xl">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    RETURN TO DASHBOARD
                </button>
                <div id="dish-card-container" class="max-w-3xl mx-auto"></div>
            </section>
        </main>

        <div id="settings-modal"
            class="fixed inset-0 bg-slate-950/95 flex items-center justify-center z-[100] p-6 hidden backdrop-blur-3xl">
            <div
                class="bg-slate-900 rounded-[3rem] shadow-2xl w-full max-w-2xl max-h-[85vh] overflow-hidden border border-slate-800 flex flex-col scale-in">
                <div class="p-8 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                    <div>
                        <h2
                            class="text-2xl font-black text-white uppercase tracking-tighter italic underline decoration-indigo-500 decoration-4 underline-offset-8">
                            Neural Setup</h2>
                        <p class="text-[10px] text-slate-500 font-black uppercase tracking-[0.3em] mt-3">System
                            Synchronization</p>
                    </div>
                    <button id="settings-close-btn"
                        class="p-3 text-slate-500 hover:text-white hover:bg-slate-800 rounded-2xl transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>

                <!-- Tab Header -->
                <div class="flex border-b border-slate-800">
                    <button id="tab-prod-btn"
                        class="flex-1 py-4 text-[10px] sm:text-xs font-black uppercase tracking-widest text-orange-400 border-b-2 border-orange-500 bg-slate-800/30 transition-all hover:bg-slate-800/60">Production
                        Import</button>
                    <button id="tab-menu-btn"
                        class="flex-1 py-4 text-[10px] sm:text-xs font-black uppercase tracking-widest text-slate-500 border-b-2 border-transparent hover:text-indigo-400 hover:bg-slate-800/30 transition-all">Menu
                        Manifest</button>
                </div>

                <div class="p-8 overflow-y-auto flex-grow custom-scrollbar">
                    <!-- Production Tab Content -->
                    <div id="tab-prod-content" class="space-y-4 animate-in fade-in duration-300">
                        <div class="space-y-3">
                            <label for="production-json-input"
                                class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] px-2 flex justify-between">
                                <span>Production Orders (JSON)</span>
                                <span class="text-orange-500">KDS DATA SOURCE</span>
                            </label>
                            <textarea id="production-json-input" rows="8"
                                class="w-full p-6 border rounded-[2rem] bg-slate-950 border-slate-800 text-orange-400 font-mono text-[12px] focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 outline-none transition-all placeholder:text-slate-800 leading-relaxed shadow-inner"
                                placeholder='Paste order array: [{"name": "Dish...", "recipe": ["Item x1 (100g)"], "readyBy": 600 ...}]'></textarea>
                        </div>
                    </div>

                    <!-- Menu Tab Content -->
                    <div id="tab-menu-content" class="space-y-4 hidden animate-in fade-in duration-300">
                        <div class="space-y-3">
                            <label for="json-input"
                                class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] px-2 flex justify-between">
                                <span>Menu Manifest (JSON)</span>
                                <span class="text-indigo-500">AUDIT BLUEPRINTS</span>
                            </label>
                            <textarea id="json-input" rows="8"
                                class="w-full p-6 border rounded-[2rem] bg-slate-950 border-slate-800 text-indigo-400 font-mono text-[12px] focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all placeholder:text-slate-800 leading-relaxed shadow-inner"
                                placeholder="Paste menu structure for quality checking..."></textarea>
                        </div>
                    </div>

                    <p id="settings-error"
                        class="text-red-500 text-[11px] font-black px-2 uppercase tracking-tight mt-4 text-center"></p>
                </div>
                <div class="p-8 bg-slate-900/80 border-t border-slate-800 flex justify-end gap-4">
                    <button id="settings-cancel-btn"
                        class="px-8 py-3.5 text-xs font-black rounded-2xl bg-slate-800 text-slate-400 hover:text-white transition-all active:scale-95 border border-slate-700">Abort</button>
                    <button id="settings-save-btn"
                        class="px-12 py-3.5 text-xs font-black text-white bg-indigo-600 rounded-2xl hover:bg-indigo-700 shadow-2xl shadow-indigo-600/30 transition-all active:scale-95 border-b-4 border-indigo-800">Commit
                        Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js" type="module"></script>
</body>

</html>
