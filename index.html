<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Culinary Quality Control | Premium</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: "#020617"
                        },
                        emerald: {
                            500: "#10b981",
                            600: "#059669"
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        
        .nav-btn-active {
            background-color: rgba(16, 185, 129, 0.15);
            color: #10b981 !important;
            border-right: 2px solid #10b981;
        }

        .qc-table th {
            background: #0f172a;
            color: #94a3b8;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
        }

        .qc-table td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            #app-container { flex-direction: column; }
            nav { 
                width: 100% !important; height: 60px !important; flex-direction: row !important; 
                padding: 0 16px !important; position: fixed; bottom: 0; left: 0; z-index: 999;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
            }
            main { padding-bottom: 70px; }
            header { height: auto !important; padding: 12px 16px !important; flex-direction: column; align-items: flex-start !important; gap: 12px !important; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="antialiased h-screen overflow-hidden selection:bg-emerald-500/30">
    <div id="app-container" class="flex h-full w-full">

        <!-- ========== PREMIUM SIDEBAR ========== -->
        <nav class="w-16 flex-shrink-0 bg-slate-950 border-r border-white/5 flex flex-col items-center py-6 gap-2 z-50 overflow-y-auto custom-scrollbar">
            <div class="p-2 mb-4">
                <div class="h-8 w-8 rounded-lg bg-emerald-600 flex items-center justify-center font-bold text-white shadow-lg shadow-emerald-600/20">B</div>
            </div>
            
            <button id="nav-forecast-btn" class="p-3 rounded-xl text-slate-500 hover:text-emerald-400 hover:bg-emerald-500/5 transition-all" title="Order Forecast">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
            </button>
            <button id="nav-ingredient-btn" class="p-3 rounded-xl text-slate-500 hover:text-emerald-400 hover:bg-emerald-500/5 transition-all" title="Ingredient Qty">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.256 1.189-3.103.551-.617.911-1.167 1.311-1.897z"/></svg>
            </button>
            <button id="nav-kitchen-btn" class="p-3 rounded-xl text-slate-500 hover:text-emerald-400 hover:bg-emerald-500/5 transition-all" title="Kitchen Assign">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/><line x1="6" x2="18" y1="17" y2="17"/></svg>
            </button>
            <button id="nav-thermal-btn" class="p-3 rounded-xl text-slate-500 hover:text-emerald-400 hover:bg-emerald-500/5 transition-all" title="Thermal & Weight Log">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>
            </button>
            
            <div class="w-8 h-px bg-white/5 my-2"></div>
            
            <button id="nav-dish-btn" class="p-3 rounded-xl text-slate-500 hover:text-emerald-400 hover:bg-emerald-500/5 transition-all" title="Manager: Assign Dishes">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
            </button>
            <button id="nav-assembler-btn" class="p-3 rounded-xl text-slate-500 hover:text-emerald-400 hover:bg-emerald-500/5 transition-all" title="Assembler View">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </button>
            
            <div class="w-8 h-px bg-white/5 my-2"></div>
            
            <button id="nav-audit-btn" class="p-3 rounded-xl text-slate-500 hover:text-emerald-400 hover:bg-emerald-500/5 transition-all" title="Quality Control">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            </button>
            
            <button id="settings-btn" class="mt-auto p-3 text-slate-600 hover:text-white transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </nav>


        <!-- ========== MAIN CONTENT AREA ========== -->
        <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">

            <!-- Deep Ocean Header -->
            <header class="h-16 flex-shrink-0 flex items-center justify-between px-8 bg-slate-950 border-b border-white/5">
                <div class="flex items-center gap-6">
                    <h1 id="page-title" class="text-sm font-bold text-white tracking-widest uppercase">Culinary QC Dashboard</h1>
                    <div class="flex items-center bg-slate-900 border border-white/5 p-1 rounded-lg text-[10px] font-bold">
                        <button id="toggle-daily-btn" class="px-4 py-1.5 bg-emerald-600 shadow-lg shadow-emerald-600/20 rounded text-white">DAILY</button>
                        <button id="toggle-weekly-btn" class="px-4 py-1.5 text-slate-500 hover:text-slate-300">WEEKLY</button>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div id="day-picker" class="flex items-center bg-slate-900 rounded-lg p-1 border border-white/5">
                        <button class="day-tab px-3 py-1.5 text-[10px] font-bold rounded bg-slate-800 text-white" data-day="mon">MON</button>
                        <button class="day-tab px-3 py-1.5 text-[10px] font-bold rounded text-slate-500 hover:text-slate-300" data-day="tue">TUE</button>
                        <button class="day-tab px-3 py-1.5 text-[10px] font-bold rounded text-slate-500 hover:text-slate-300" data-day="wed">WED</button>
                        <button class="day-tab px-3 py-1.5 text-[10px] font-bold rounded text-slate-500 hover:text-slate-300" data-day="thu">THU</button>
                        <button class="day-tab px-3 py-1.5 text-[10px] font-bold rounded text-slate-500 hover:text-slate-300" data-day="fri">FRI</button>
                    </div>

                    <div id="date-picker-trigger" class="flex items-center gap-2 bg-slate-900 border border-white/5 px-4 py-2 rounded-lg text-[11px] font-bold text-slate-300 hover:bg-slate-800 transition-colors">
                        <svg class="h-3 w-3 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        <span id="header-date-display">29 MAR 2026</span>
                    </div>
                </div>
            </header>

            <!-- ========== VIEW CONTAINERS ========== -->
            <main class="flex-1 overflow-hidden flex bg-slate-950">

                <!-- MAIN QC VIEW (Integrated Alert Grid + Summary) -->
                <div id="main-view" class="flex-1 flex flex-col overflow-hidden p-8 gap-8">
                    <!-- Alert Grid Section -->
                    <div class="flex-shrink-0">
                        <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4">Hot Dish Status Grid</h3>
                        <div id="operators-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-4"></div>
                    </div>

                    <!-- Summary Table Section -->
                    <div class="flex-1 flex flex-col min-h-0">
                        <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4">Quality Control Log</h3>
                        <div class="flex-1 glass-panel rounded-xl overflow-hidden shadow-2xl flex flex-col">
                            <div class="overflow-x-auto custom-scrollbar">
                                <table class="qc-table w-full">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Dish Name</th>
                                            <th>Avg Temp</th>
                                            <th>Avg/Theo Wt</th>
                                            <th>AI status</th>
                                            <th>Comments</th>
                                        </tr>
                                    </thead>
                                    <tbody id="ingredients-list"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ALL OTHER VIEWS (Preserved Containers) -->
                <section id="production-view" class="hidden flex-1 h-full overflow-y-auto custom-scrollbar p-8"></section>
                <section id="prep-view" class="hidden flex-1 h-full overflow-y-auto custom-scrollbar p-8"></section>
                <section id="hygiene-view" class="hidden flex-1 h-full overflow-y-auto custom-scrollbar p-8"></section>
                <section id="dish-detail-view" class="hidden flex-1 h-full overflow-y-auto custom-scrollbar p-8"></section>
                <section id="ai-agent-view" class="hidden flex-1 h-full overflow-y-auto custom-scrollbar p-8"></section>
                <section id="compliance-view" class="hidden flex-1 h-full overflow-y-auto custom-scrollbar p-8"></section>
                <section id="logistics-view" class="hidden flex-1 h-full overflow-y-auto custom-scrollbar p-8"></section>
                <section id="ingredient-view" class="hidden flex-1 h-full overflow-y-auto custom-scrollbar p-8"></section>
                <section id="kitchen-view" class="hidden flex-1 h-full overflow-y-auto custom-scrollbar p-8"></section>
                <section id="dish-assign-view" class="hidden flex-1 h-full overflow-hidden custom-scrollbar"></section>
                <section id="assembler-view" class="hidden flex-1 h-full overflow-y-auto custom-scrollbar p-8"></section>
                <section id="forecast-view" class="hidden flex-1 h-full overflow-y-auto custom-scrollbar p-8"></section>
                <section id="thermal-view" class="hidden flex-1 h-full overflow-y-auto custom-scrollbar p-8"></section>

                <div id="welcome-placeholder" class="hidden"></div>
            </main>
        </div>
    </div>

    <!-- Modals & Notifications -->
    <div id="modal-container" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[100] hidden items-center justify-center p-4"></div>
    <div id="notification-container" class="fixed top-20 right-4 z-[200] w-full max-w-sm pointer-events-none space-y-2"></div>

    <!-- Main JS Modules -->
    <script type="module" src="./view-forecast.js?v=7.0.0"></script>
    <script type="module" src="./view-ingredient-qty.js?v=7.0.0"></script>
    <script type="module" src="./view-kitchen-overview.js?v=7.0.0"></script>
    <script type="module" src="./view-thermal.js?v=7.0.0"></script>
    <script type="module" src="./view-dish-assign.js?v=7.0.0"></script>
    <script type="module" src="./view-assembler.js?v=7.0.0"></script>
    <script type="module" src="./view-analytics.js?v=7.0.0"></script>
    <script type="module" src="./view-prep.js?v=7.0.0"></script>
    <script type="module" src="./view-hygiene.js?v=7.0.0"></script>
    <script type="module" src="./view-compliance.js?v=7.0.0"></script>
    <script type="module" src="./index.js?v=7.0.0"></script>
</body>

</html>
