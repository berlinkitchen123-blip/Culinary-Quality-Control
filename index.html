<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Culinary Quality Control | Bella & Bona</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050505;
            --bg-panel: #0f0f0f;
            --bg-card: #171717;
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }
        body {
            background-color: var(--bg-deep);
            color: #d4d4d4;
            font-family: 'Inter', sans-serif;
        }
        .pro-sidebar {
            background-color: #0d0d0d;
            border-right: 1px solid rgba(255,255,255,0.05);
        }
        .pro-card {
            background-color: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 1rem;
        }
        .status-pill {
            padding: 2px 8px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-64 pro-sidebar flex flex-col hidden md:flex">
        <div class="p-8">
            <h1 class="text-xl font-black italic tracking-tighter text-white">BELLA & BONA</h1>
            <p class="text-[9px] font-black text-emerald-500 tracking-[0.3em] uppercase mt-1">Culinary Intelligence</p>
        </div>
        <nav class="flex-1 px-4 space-y-2">
            <button id="nav-dashboard" class="w-full flex items-center gap-3 px-4 py-3 text-emerald-400 bg-emerald-500/10 rounded-xl font-bold text-xs">
                <span>📊</span> Dashboard
            </button>
            <button id="nav-reports" class="w-full flex items-center gap-3 px-4 py-3 text-slate-500 hover:text-white transition-all font-bold text-xs group">
                <span class="opacity-50 group-hover:opacity-100">📋</span> Reports
            </button>
            <button id="nav-analytics" class="w-full flex items-center gap-3 px-4 py-3 text-slate-500 hover:text-white transition-all font-bold text-xs group">
                <span class="opacity-50 group-hover:opacity-100">📈</span> Live Pipeline
            </button>
            <div class="pt-8 px-4">
                <p class="text-[9px] font-black text-slate-600 uppercase tracking-widest mb-4">Operations</p>
                <button id="nav-prep" class="w-full flex items-center gap-3 px-4 py-2 text-slate-500 hover:text-white transition-all font-bold text-xs mb-2">
                    🍳 Kitchen Prep
                </button>
                <button id="nav-hygiene" class="w-full flex items-center gap-3 px-4 py-2 text-slate-500 hover:text-white transition-all font-bold text-xs mb-2">
                    🫧 Hygiene Audit
                </button>
            </div>
        </nav>
        <div class="p-6 border-t border-white/5">
            <button class="w-full py-2 bg-white/5 border border-white/5 rounded-lg text-slate-400 text-[10px] font-bold hover:bg-white/10 transition-all">SETTINGS</button>
        </div>
    </aside>

    <!-- MAIN VIEW -->
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden relative">
        <!-- GLOBAL LOADER (Mimicking reference site behavior) -->
        <div id="loading-overlay" class="absolute inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
            <div class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
        </div>

        <!-- HEADER -->
        <header class="h-20 flex-shrink-0 flex items-center justify-between px-10 border-b border-white/5">
            <div>
                <h2 class="text-[10px] font-black text-slate-500 uppercase tracking-[0.4em]">Operational Overview</h2>
                <div class="flex items-center gap-4 mt-1">
                    <span id="header-date" class="text-xl font-black text-white italic tracking-tighter uppercase">Wednesday, 21 May 2026</span>
                    <span class="text-[10px] font-black bg-emerald-500/10 text-emerald-500 px-3 py-1 rounded-full border border-emerald-500/20 tracking-widest">LIVE SYNC</span>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <!-- Toggle as seen on site -->
                <div class="bg-black border border-white/10 p-1 rounded-xl flex items-center gap-1">
                    <button class="px-6 py-2 bg-emerald-600 text-white text-[10px] font-black rounded-lg shadow-xl shadow-emerald-600/20">DAILY</button>
                    <button class="px-6 py-2 text-slate-500 text-[10px] font-black hover:text-slate-300">WEEKLY</button>
                </div>
                <!-- Export with the same icon feel -->
                <button class="p-3 bg-white/5 border border-white/10 rounded-xl hover:bg-white/10 transition-all group">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="text-slate-400 group-hover:text-white transition-colors" stroke="currentColor" stroke-width="2"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                </button>
            </div>
        </header>

        <!-- DASHBOARD SCROLL AREA -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-10 space-y-12">
            
            <!-- HOT DISH ALERTS (GRID-COLS-4) -->
            <section>
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-xs font-black text-slate-600 uppercase tracking-widest italic">Live Hot Dish Pipeline</h3>
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Severity: Low to High</span>
                </div>
                <div id="hot-dish-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <!-- Cards will be injected by modern-ui.js -->
                </div>
            </section>

            <!-- DAILY SUMMARY TABLE -->
            <section>
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-xs font-black text-slate-600 uppercase tracking-widest italic">Quality Control Summary</h3>
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span class="text-[10px] font-bold text-emerald-500">All Systems Nominal</span>
                        </div>
                    </div>
                </div>
                
                <div class="pro-card overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-black/50 border-b border-white/5">
                                <th class="px-6 py-4 text-[10px] font-black text-slate-500 tracking-widest uppercase italic">Dish Identity</th>
                                <th class="px-6 py-4 text-[10px] font-black text-slate-500 tracking-widest uppercase italic border-l border-white/5">Status</th>
                                <th class="px-6 py-4 text-[10px] font-black text-slate-500 tracking-widest uppercase italic border-l border-white/5">Compliance (Temp)</th>
                                <th class="px-6 py-4 text-[10px] font-black text-slate-500 tracking-widest uppercase italic border-l border-white/5">Chef Notes</th>
                            </tr>
                        </thead>
                        <tbody id="summary-table-body">
                            <!-- Rows injected by modern-ui.js -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- MODAL CONTAINER (GLASS) -->
    <div id="modal-container" class="fixed inset-0 z-[60] flex items-center justify-center p-6 bg-black/80 backdrop-blur-sm hidden animate-in fade-in duration-300">
        <!-- Content injected dynamically -->
    </div>

    <!-- MAIN LOGIC -->
    <script type="module" src="modern-ui.js"></script>
</body>
</html>
