<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Culinary Quality Control</title>
    <style>
        body {
            background-color: #f7f7f7;
            color: #022c22;
            -webkit-tap-highlight-color: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(2, 44, 34, 0.1);
            border-radius: 10px;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        border: "hsl(214.3 31.8% 91.4%)",
                        input: "hsl(214.3 31.8% 91.4%)",
                        ring: "hsl(160 84% 19%)",
                        background: "hsl(0 0% 100%)",
                        foreground: "hsl(222.2 84% 4.9%)",
                        primary: {
                            DEFAULT: "hsl(160 84% 19%)",
                            foreground: "hsl(0 0% 100%)",
                        },
                        secondary: {
                            DEFAULT: "hsl(210 40% 96.1%)",
                            foreground: "hsl(222.2 47.4% 11.2%)",
                        },
                        muted: {
                            DEFAULT: "hsl(210 40% 96.1%)",
                            foreground: "hsl(215.4 16.3% 46.9%)",
                        },
                        accent: {
                            DEFAULT: "hsl(210 40% 96.1%)",
                            foreground: "hsl(222.2 47.4% 11.2%)",
                        },
                        card: {
                            DEFAULT: "hsl(0 0% 100%)",
                            foreground: "hsl(222.2 84% 4.9%)",
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="antialiased font-sans h-screen overflow-hidden bg-[#f7f7f7] text-slate-900 selection:bg-emerald-500/30">
    <div id="app-container" class="flex h-full w-full">
        <!-- Global Vertical Sidebar -->
        <nav class="w-16 flex-shrink-0 bg-[#022c22] flex flex-col items-center py-6 gap-6 z-50">
            <div class="p-2 bg-emerald-500/10 rounded-lg mb-4 text-emerald-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            
            <button id="nav-dashboard-btn" class="p-2 rounded-md text-emerald-400 font-bold transition-all relative group" title="Live Check">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                <span class="absolute left-14 bg-[#022c22] text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none border border-white/10 shadow-xl">Live Check</span>
            </button>
            <button id="nav-production-btn" class="p-2 rounded-md text-emerald-400/50 hover:text-white transition-all group relative" title="Production">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16V8"/><path d="M11 16V12"/><path d="M15 16V5"/><path d="M19 16V10"/></svg>
                <span class="absolute left-14 bg-[#022c22] text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none border border-white/10 shadow-xl">Production</span>
            </button>
            <button id="nav-prep-btn" class="p-2 rounded-md text-emerald-400/50 hover:text-white transition-all group relative" title="Kitchen Log">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M8 7h6"/><path d="M8 11h8"/><path d="M8 15h6"/></svg>
                <span class="absolute left-14 bg-[#022c22] text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none border border-white/10 shadow-xl">Kitchen Log</span>
            </button>
            <button id="nav-hygiene-btn" class="p-2 rounded-md text-emerald-400/50 hover:text-white transition-all group relative" title="Hygiene">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M7 2v4"/><path d="M17 2v4"/><path d="M2 10h20"/><path d="M8 15h2"/><path d="M14 15h2"/></svg>
                <span class="absolute left-14 bg-[#022c22] text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none border border-white/10 shadow-xl">Hygiene</span>
            </button>
            <button id="nav-audit-btn" class="p-2 rounded-md text-emerald-400/50 hover:text-white transition-all group relative" title="Analytics">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
                <span class="absolute left-14 bg-[#022c22] text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none border border-white/10 shadow-xl">Analytics</span>
            </button>
            
            <div class="mt-auto flex flex-col gap-4">
                <button id="settings-btn" class="p-2 text-emerald-400/50 hover:text-white transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
        </nav>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
            <!-- White Header -->
            <header class="h-16 flex-shrink-0 flex items-center justify-between px-8 bg-white border-b border-slate-200">
                <div class="flex items-center gap-6">
                    <h1 id="page-title" class="text-lg font-bold text-[#022c22] tracking-tight">Assign Line Preparation</h1>
                    <div class="flex items-center bg-slate-100 p-1 rounded-md text-[10px] font-bold">
                        <button class="px-4 py-1.5 bg-white shadow-sm rounded text-slate-800">DAILY</button>
                        <button class="px-4 py-1.5 text-slate-500 hover:text-slate-700">WEEKLY</button>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 px-4 py-2 rounded-md text-xs cursor-pointer hover:bg-slate-100 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        <span id="header-date-display" class="font-bold">29 MAR 2026</span>
                    </div>
                </div>
            </header>

            <!-- Page Scrollable Area -->
            <main class="flex-1 overflow-y-auto p-8 custom-scrollbar">
                <!-- Dashboard View (Kanban) -->
                <div id="main-view" class="space-y-8 animate-in fade-in slide-in-from-bottom-2 duration-500">
                    <section id="kanban-section" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        <!-- Column 1: Processing -->
                        <div class="flex flex-col h-full min-h-[600px] border border-slate-200 rounded-lg overflow-hidden bg-white shadow-sm" ondragover="window.allowDrop(event)" ondrop="window.dropDish(event, 'processing')">
                            <div class="bg-[#022c22] p-4 flex items-center justify-between">
                                <h3 class="text-[10px] font-bold text-white uppercase tracking-[0.1em]">Processing Unit</h3>
                                <div class="flex items-center gap-2">
                                    <span id="count-processing" class="bg-emerald-500/20 text-emerald-400 text-[9px] font-bold px-1.5 py-0.5 rounded">0</span>
                                </div>
                            </div>
                            <div id="processing-list" class="flex-1 p-4 bg-slate-50/50 space-y-3 custom-scrollbar overflow-y-auto"></div>
                        </div>

                        <!-- Column 2: Cooking -->
                        <div class="flex flex-col h-full min-h-[600px] border border-slate-200 rounded-lg overflow-hidden bg-white shadow-sm" ondragover="window.allowDrop(event)" ondrop="window.dropDish(event, 'cooking')">
                            <div class="bg-[#022c22] p-4 flex items-center justify-between">
                                <h3 class="text-[10px] font-bold text-white uppercase tracking-[0.1em]">Cooking Phase</h3>
                                <div class="flex items-center gap-2">
                                    <span id="count-cooking" class="bg-emerald-500/20 text-emerald-400 text-[9px] font-bold px-1.5 py-0.5 rounded">0</span>
                                </div>
                            </div>
                            <div id="cooking-list" class="flex-1 p-4 bg-slate-50/50 space-y-3 custom-scrollbar overflow-y-auto"></div>
                        </div>

                        <!-- Column 3: Completed -->
                        <div class="flex flex-col h-full min-h-[600px] border border-slate-200 rounded-lg overflow-hidden bg-white shadow-sm" ondragover="window.allowDrop(event)" ondrop="window.dropDish(event, 'completed')">
                            <div class="bg-[#022c22] p-4 flex items-center justify-between">
                                <h3 class="text-[10px] font-bold text-white uppercase tracking-[0.1em]">Log Ready</h3>
                                <div class="flex items-center gap-2">
                                    <span id="count-completed" class="bg-emerald-500/20 text-emerald-400 text-[9px] font-bold px-1.5 py-0.5 rounded">0</span>
                                </div>
                            </div>
                            <div id="completed-list" class="flex-1 p-4 bg-slate-50/50 space-y-3 custom-scrollbar overflow-y-auto"></div>
                        </div>
                    </section>
                </div>

                <!-- Hidden sections for navigation -->
                <section id="production-view" class="hidden"></section>
                <section id="prep-view" class="hidden"></section>
                <section id="hygiene-view" class="hidden"></section>
                <div id="welcome-placeholder" class="hidden"></div>
            </main>
        </div>
    </div>

    <!-- Modals & Containers -->
    <div id="modal-container" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] hidden items-center justify-center p-4"></div>
    <div id="notification-container" class="fixed top-20 right-4 z-[200] w-full max-w-sm pointer-events-none space-y-2"></div>

    <script src="config.js"></script>
    <script src="dom-elements.js"></script>
    <script src="utils.js"></script>
    <script src="firebase-service.js" type="module"></script>
    <script src="ui-notifications.js"></script>
    <script src="view-production.js"></script>
    <script src="view-prep.js"></script>
    <script src="view-hygiene.js"></script>
    <script src="view-dashboard.js"></script>
    <script src="index.js" type="module"></script>
</body>

</html>
